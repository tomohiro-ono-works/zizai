name: Migration Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  static-analysis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Sync Python dependencies
        run: uv sync --frozen
      - name: Run static analysis gate
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run-verification.ps1 -Gate static-analysis

  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Sync Python dependencies
        run: uv sync --frozen
      - name: Run unit gate
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run-verification.ps1 -Gate unit

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Sync Python dependencies
        run: uv sync --frozen
      - name: Run integration gate
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run-verification.ps1 -Gate integration

  browser-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/playwright
        run: npm ci
      - name: Install Chromium
        working-directory: tests/playwright
        run: npx playwright install chromium
      - name: Run browser-only regression specs
        working-directory: tests/playwright
        run: npm test

  webengine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Sync Python dependencies
        run: uv sync --frozen
      - name: Install browser test dependencies
        working-directory: tests/playwright
        run: npm ci
      - name: Install Chromium
        working-directory: tests/playwright
        run: npx playwright install chromium
      - name: Run WebEngine and browser gate
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run-verification.ps1 -RiskId RISK-WEB-001
