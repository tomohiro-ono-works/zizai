[pytest]
testpaths = tests
markers =
    static_analysis: repository source and contract checks
    unit: pure behavior checks
    integration: subprocess and component boundary checks
    e2e: Windows runtime and browser checks
    risk_entry_001: RISK-ENTRY-001 verifier
    risk_path_001: RISK-PATH-001 verifier
    risk_conn_001: RISK-CONN-001 verifier
    risk_conn_002: RISK-CONN-002 verifier
    risk_config_001: RISK-CONFIG-001 verifier
    risk_bridge_001: RISK-BRIDGE-001 verifier
    risk_fs_001: RISK-FS-001 verifier
    risk_ext_001: RISK-EXT-001 verifier
    risk_web_001: RISK-WEB-001 verifier
    risk_web_002: RISK-WEB-002 verifier
    risk_ui_001: RISK-UI-001 verifier
    risk_ci_001: RISK-CI-001 verifier
